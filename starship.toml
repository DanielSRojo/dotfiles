# --- jj / git integration -------------------------------------------------
# jj parks git HEAD at @- and detaches it, so ref/HEAD-based git modules go
# stale in colocated repos. git_branch and git_commit are disabled above;
# git_state below. custom.jj shows live jj state instead; custom.git_branch
# covers plain-git repos. git_status stays enabled (it's live in both).

[git_state]
disabled = true

# Nerd-font glyphs from Omarchy's default prompt, replacing starship's ASCII.
# git_status stays enabled -- unlike git_branch/git_commit, it is live under jj.
[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# jj change info via starship-jj (https://gitlab.com/lanastara_foss/starship-jj).
# Install: cargo install starship-jj --locked
# The when-guard limits it to jj repos and walks up the tree (unlike
# detect_folders, which only checks the cwd and so missed subdirectories);
# outside a jj repo starship-jj emits a lone symbol, which the guard suppresses.
# --ignore-working-copy stops starship from snapshotting the working copy every
# render. Formatting/symbols now live in ~/.config/starship-jj/starship-jj.toml
# (run `starship-jj starship config default` for the annotated template).
[custom.jj]
description = "current jj change (via starship-jj)"
when = "jj --ignore-working-copy root"
command = "starship-jj --ignore-working-copy starship prompt"
# Force sh -c so `when`/`command` parse the same regardless of STARSHIP_SHELL
# (this shell is fish, where a bare command arg is treated as a script path).
shell = ["sh", "-c"]
format = "$output "
ignore_timeout = true
use_stdin = false

# Only OUTSIDE jj repos — the when-guard fails (returns non-zero) inside one.
[custom.git_branch]
description = "git branch when not in a jj repo"
when = "! jj --ignore-working-copy root"
command = "git branch --show-current"
symbol = " "
style = "bold purple"
ignore_timeout = true
format = "on [$symbol$output]($style) "
