# herdr configuration.
#
# Deliberately minimal rather than a copy of `herdr --default-config`: that dump
# is a snapshot of one version's defaults and goes stale silently -- the file this
# replaced was written by an older herdr and had already lost options the 0.9.0
# binary knows about. Run `herdr --default-config` for the annotated reference;
# keep only real overrides here.

onboarding = false

[theme]
name = "gruvbox"

[experimental]
pane_history = false

[keys]
# zellij's unlock key. herdr has no locked mode, so this is a plain tmux-style
# prefix here, but the finger already knows it.
prefix = "ctrl+space"

# --- Direct layer ----------------------------------------------------------
# zellij runs with `default_mode "locked"`, so these alt chords -- not the prefix
# ones -- are the bindings that actually get pressed all day. herdr accepts a
# list per action, so the prefix form stays live alongside them rather than
# being traded away.
#
# Same tradeoff as in zellij: these chords are swallowed by herdr and never
# reach the shell or agent running inside the pane.
focus_pane_left = "prefix+h"   # alt+h is a command binding below (MoveFocusOrTab)
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = "prefix+l"  # alt+l is a command binding below (MoveFocusOrTab)

# zellij: Alt+i / Alt+o (MoveTab). Unbound in herdr by default.
move_tab_previous = "alt+i"
move_tab_next = "alt+o"

# Direct tab jumps, one modifier up from the pane keys. These skip straight to
# the neighbouring tab instead of walking through every pane on the way, which
# alt+h / alt+l now do (see the command bindings at the end of this file).
# `next_tab` has no prefix form left -- `n` is new-tab below, matching zellij's
# tab-mode -- so if alt+shift proves unreliable here, reach for prefix+1..9.
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = "alt+shift+l"

# zellij's Alt+n (bare NewPane) splits along the focused pane's longer axis.
# herdr has no auto-direction split, so this picks side-by-side; move it to
# split_horizontal to make it stack instead.
split_vertical = ["prefix+v", "alt+n"]

# --- Prefix layer ----------------------------------------------------------
# zellij reaches these through a mode (Ctrl+Space, then p/t/s, then the letter);
# herdr has one flat namespace after the prefix. Where a zellij leaf letter was
# free it wins, and the rest keep herdr's own key -- zellij's letters only
# disambiguate inside a mode, and several collide once flattened. Notably `r`
# stays resize-mode (zellij's normal-mode `r`) rather than becoming pane-mode's
# split-right, which is why split_vertical keeps `v` above.

new_tab = "prefix+n"                             # zellij tab-mode `n`
zoom = "prefix+f"                                # zellij pane-mode `f` (fullscreen)
split_horizontal = ["prefix+d", "prefix+minus"]  # zellij pane-mode `d` (down)
rename_pane = "prefix+c"                         # zellij pane-mode `c`; freed by new_tab taking `n`

# Left at herdr's default because it already agrees with the zellij leaf key:
#   x close pane . e edit scrollback . r resize mode . w workspace picker
#   1..9 switch tab . tab cycle pane
# Left at herdr's default because zellij has no counterpart:
#   q detach . b sidebar . g goto . shift+x close tab . shift+t rename tab
#
# No herdr equivalent at any binding, so these zellij reflexes simply miss:
#   floating panes (Alt+f, pane-mode w/e), swap layouts (Alt+[ / Alt+]),
#   scroll mode (Ctrl+Space s -> j/k/u/d), sync tab, break pane to tab,
#   and move/swap-pane mode.

# --- MoveFocusOrTab --------------------------------------------------------
# zellij's Alt+h / Alt+l focus a pane and fall through to the neighbouring tab
# once the focused pane is already at the edge. herdr has no action that does
# both, so focus-or-tab (stowed beside this file) chains them and takes the two
# keys directly -- which is why focus_pane_left/right above keep only their
# prefix form. A key cannot sit on a built-in action and a command at once;
# herdr's conflict check silently disables one of them if it does.
#
# alt+j / alt+k stay plain focus_pane_* on purpose: zellij binds those to
# MoveFocus, not MoveFocusOrTab, so vertical movement never crossed tabs there.

[[keys.command]]
key = "alt+h"
type = "shell"
command = "$HOME/.config/herdr/focus-or-tab left"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "$HOME/.config/herdr/focus-or-tab right"
