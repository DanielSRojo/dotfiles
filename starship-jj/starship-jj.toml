# starship-jj (https://gitlab.com/lanastara_foss/starship-jj) renders the jj part
# of the prompt; starship.toml calls it through [custom.jj]. Regenerate the
# stock version with `starship-jj starship config default` -- it is the whole
# config, not an overlay, so the module list has to stay complete.

module_separator = " "
reset_color = false

[bookmarks]
search_depth = 100
exclude = []

[[module]]
type = "Symbol"
symbol = "󱗆 "
color = "Blue"

[[module]]
type = "Bookmarks"
separator = " "
color = "Magenta"
behind_symbol = "⇡"
surround_with_quotes = false
# "All" skips described-but-empty ancestors;
# "Current" only forgives the change being worked on right now.
ignore_empty_commits = "None"

[[module]]
type = "Commit"
previous_message_symbol = "⇣"
max_length = 24
show_previous_if_empty = false
empty_text = "(no description set)"
surround_with_quotes = true

[module.non_unique]
color = "Black"

[[module]]
type = "State"
separator = " "

[module.conflict]
disabled = false
text = "(CONFLICT)"
color = "Red"

[module.divergent]
disabled = false
text = "(DIVERGENT)"
color = "Cyan"

[module.empty]
disabled = false
text = "(EMPTY)"
color = "Yellow"

[module.immutable]
disabled = false
text = "(IMMUTABLE)"
color = "Yellow"

[module.hidden]
disabled = false
text = "(HIDDEN)"
color = "Yellow"

[[module]]
type = "Metrics"
template = "[{changed} {added}{removed}]"
hide_if_empty = false
color = "Magenta"

[module.changed_files]
prefix = ""
suffix = ""
color = "Cyan"

[module.added_lines]
prefix = "+"
suffix = ""
color = "Green"

[module.removed_lines]
prefix = "-"
suffix = ""
color = "Red"

